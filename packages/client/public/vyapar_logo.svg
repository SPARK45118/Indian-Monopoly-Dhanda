<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#f1f5f9" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="52%" stop-color="#64748b" />
      <stop offset="85%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- LEFT EMBLEM / HEXAGON SHIELD -->
  <g transform="translate(40, 20)">
    <!-- Shield Outer Glow -->
    <polygon points="120,5 220,55 220,175 120,225 20,175 20,55" 
             fill="none" stroke="#dc2626" stroke-width="6" filter="url(#redGlow)" opacity="0.7"/>
    
    <!-- Shield Main Body -->
    <polygon points="120,10 215,58 215,172 120,220 25,172 25,58" 
             fill="url(#shieldBg)" stroke="#dc2626" stroke-width="4"/>

    <!-- Inner Border Line -->
    <polygon points="120,20 205,62 205,166 120,210 35,166 35,62" 
             fill="none" stroke="#7f1d1d" stroke-width="1.5" opacity="0.6"/>

    <!-- Palace / Red Fort Silhouette -->
    <g transform="translate(50, 45)" fill="#dc2626">
      <!-- Flagpole & Flag -->
      <line x1="70" y1="5" x2="70" y2="35" stroke="#ef4444" stroke-width="2.5"/>
      <path d="M70,5 L88,12 L70,19 Z" fill="#ef4444"/>

      <!-- Center Main Dome -->
      <path d="M50,45 C50,22 90,22 90,45 Z" fill="#dc2626"/>
      <rect x="52" y="45" width="36" height="35" fill="#dc2626"/>
      <path d="M60,80 C60,65 80,65 80,80 Z" fill="#09090b"/> <!-- Archway entrance -->

      <!-- Left Minaret & Dome -->
      <path d="M22,48 C22,35 42,35 42,48 Z" fill="#b91c1c"/>
      <rect x="24" y="48" width="16" height="32" fill="#b91c1c"/>
      <!-- Left side wall battlement -->
      <rect x="5" y="55" width="16" height="25" fill="#991b1b"/>
      <rect x="5" y="50" width="4" height="6" fill="#991b1b"/>
      <rect x="11" y="50" width="4" height="6" fill="#991b1b"/>
      <rect x="17" y="50" width="4" height="6" fill="#991b1b"/>

      <!-- Right Minaret & Dome -->
      <path d="M98,48 C98,35 118,35 118,48 Z" fill="#b91c1c"/>
      <rect x="100" y="48" width="16" height="32" fill="#b91c1c"/>
      <!-- Right side wall battlement -->
      <rect x="119" y="55" width="16" height="25" fill="#991b1b"/>
      <rect x="119" y="50" width="4" height="6" fill="#991b1b"/>
      <rect x="125" y="50" width="4" height="6" fill="#991b1b"/>
      <rect x="131" y="50" width="4" height="6" fill="#991b1b"/>
    </g>

    <!-- Checkerboard floor base -->
    <g transform="translate(60, 140)">
      <polygon points="60,0 110,25 60,50 10,25" fill="#18181b" stroke="#7f1d1d" stroke-width="1.5"/>
      <line x1="35" y1="12.5" x2="85" y2="37.5" stroke="#7f1d1d" stroke-width="1"/>
      <line x1="85" y1="12.5" x2="35" y2="37.5" stroke="#7f1d1d" stroke-width="1"/>
    </g>

    <!-- 3D DICE 1 (Left - Black with Red Dots) -->
    <g transform="translate(65, 125) scale(0.95)" filter="url(#subtleShadow)">
      <!-- Top Face -->
      <polygon points="25,0 48,12 24,24 1,12" fill="#27272a" stroke="#dc2626" stroke-width="1.5"/>
      <!-- Left Face -->
      <polygon points="1,12 24,24 24,52 1,40" fill="#18181b" stroke="#dc2626" stroke-width="1.5"/>
      <!-- Right Face -->
      <polygon points="24,24 48,12 48,40 24,52" fill="#09090b" stroke="#dc2626" stroke-width="1.5"/>
      <!-- Dots -->
      <circle cx="24" cy="12" r="3" fill="#ef4444"/>
      <circle cx="12" cy="30" r="2.5" fill="#ef4444"/>
      <circle cx="12" cy="44" r="2.5" fill="#ef4444"/>
      <circle cx="36" cy="22" r="2.5" fill="#ef4444"/>
      <circle cx="36" cy="34" r="2.5" fill="#ef4444"/>
      <circle cx="36" cy="44" r="2.5" fill="#ef4444"/>
    </g>

    <!-- 3D DICE 2 (Right - Red with Black/White Dots) -->
    <g transform="translate(110, 135) scale(0.95)" filter="url(#subtleShadow)">
      <!-- Top Face -->
      <polygon points="25,0 48,12 24,24 1,12" fill="#f87171" stroke="#ffffff" stroke-width="1.5"/>
      <!-- Left Face -->
      <polygon points="1,12 24,24 24,52 1,40" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>
      <!-- Right Face -->
      <polygon points="24,24 48,12 48,40 24,52" fill="#991b1b" stroke="#ffffff" stroke-width="1.5"/>
      <!-- Dots -->
      <circle cx="24" cy="12" r="3" fill="#09090b"/>
      <circle cx="12" cy="28" r="2.5" fill="#09090b"/>
      <circle cx="12" cy="36" r="2.5" fill="#09090b"/>
      <circle cx="12" cy="44" r="2.5" fill="#09090b"/>
      <circle cx="36" cy="24" r="2.5" fill="#09090b"/>
      <circle cx="36" cy="38" r="2.5" fill="#09090b"/>
    </g>
  </g>

  <!-- CENTER ACCENT SPARKS / DIVIDER -->
  <g transform="translate(305, 135)">
    <polygon points="0,-45 4,0 0,45 -4,0" fill="#dc2626" filter="url(#redGlow)"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
  </g>

  <!-- TYPOGRAPHY: VYAPAR -->
  <g transform="translate(335, 160)" filter="url(#subtleShadow)">
    <text font-family="'Outfit', 'Montserrat', 'Arial Black', sans-serif" 
          font-size="105" 
          font-weight="900" 
          letter-spacing="4" 
          fill="url(#metalGrad)" 
          stroke="#1e293b" 
          stroke-width="3">
      VYAPAR
    </text>

    <!-- Custom Stylized Triangle inside the 'A's -->
    <polygon points="208, -32 196, -6 220, -6" fill="#dc2626"/>
    <polygon points="392, -32 380, -6 404, -6" fill="#dc2626"/>
  </g>

  <!-- BADGE: INDIA -->
  <g transform="translate(790, 85)">
    <!-- Pill Glow & Border -->
    <rect x="0" y="0" width="165" height="75" rx="16" 
          fill="#09090b" stroke="#dc2626" stroke-width="4" filter="url(#redGlow)"/>
    <rect x="0" y="0" width="165" height="75" rx="16" 
          fill="#09090b" stroke="#ef4444" stroke-width="2.5"/>
    
    <text x="82.5" y="52" 
          font-family="'Outfit', 'Impact', sans-serif" 
          font-size="44" 
          font-weight="900" 
          letter-spacing="3" 
          text-anchor="middle" 
          fill="#ef4444">
      INDIA
    </text>
  </g>

  <!-- SUBTITLE BAR: BOARD GAME OF TRADE & STRATEGY -->
  <g transform="translate(335, 205)">
    <!-- Left red line -->
    <line x1="0" y1="0" x2="45" y2="0" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Subtitle Text -->
    <text x="60" y="5" 
          font-family="'Inter', 'Outfit', sans-serif" 
          font-size="19" 
          font-weight="800" 
          letter-spacing="7" 
          fill="#cbd5e1">
      BOARD GAME OF TRADE &amp; STRATEGY
    </text>

    <!-- Right red line -->
    <line x1="585" y1="0" x2="630" y2="0" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
