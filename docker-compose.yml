version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dhandha-postgres
    environment:
      POSTGRES_DB: dhandha
      POSTGRES_USER: dhandha
      POSTGRES_PASSWORD: dhandha_secret
    ports:
      - "5432:5432"
    volumes:
      - dhandha_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dhandha"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: dhandha-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - dhandha_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  dhandha_postgres_data:
    driver: local
  dhandha_redis_data:
    driver: local
